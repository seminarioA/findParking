# Configuración de SonarQube / SonarQube Cloud para findParking (monorepo Python + TS).
# Ajusta sonar.projectKey (y sonar.organization si usas SonarQube Cloud) para que
# coincidan con tu proyecto en la instancia de SonarQube.

sonar.projectKey=findParking
sonar.projectName=findParking
# sonar.organization=tu-organizacion   # solo para SonarQube Cloud

# Código a analizar (backend Python + frontend TS/React)
sonar.sources=api,vision,metrics,ui/frontend/src
sonar.tests=tests

# Versiones / encoding
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Exclusiones: dependencias, artefactos de build, boilerplate generado y binarios.
# ui/frontend/src/components/ui es componentes generados de shadcn/ui (ruido).
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,ui/frontend/src/components/ui/**,core/resources/**,**/*.mp4,**/*.pt,**/*.onnx
sonar.coverage.exclusions=tests/**,**/*.config.*,ui/frontend/src/components/ui/**

# Cobertura (opcional): descomenta y genera los reportes en CI para poblar la
# cobertura en SonarQube.
#   - Python:  pytest --cov --cov-report=xml   -> coverage.xml
#   - Frontend: vitest run --coverage          -> ui/frontend/coverage/lcov.info
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.javascript.lcov.reportPaths=ui/frontend/coverage/lcov.info
