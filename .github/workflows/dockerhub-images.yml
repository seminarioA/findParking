name: Docker Hub Images CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    environment: DevOps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure image name
        run: |
          echo "REPO_ROOT_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/findparking" >> $GITHUB_ENV

      - name: Debug: check secrets available (no imprime valores)
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "ERROR: secrets DOCKERHUB_USERNAME or DOCKERHUB_TOKEN are not available"
            exit 1
          else
            echo "Secrets OK"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push all Dockerfiles (amd64)
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          ROOT_IMAGE="${REPO_ROOT_IMAGE}"

          echo "Usando imagen raíz: ${ROOT_IMAGE}"
          echo "SHA corto: ${SHORT_SHA}"

          # Encuentra todos los Dockerfiles versionados
          mapfile -t DOCKERFILES < <(git ls-files | grep -E '^(.*/)?Dockerfile$' || true)

          if [ ${#DOCKERFILES[@]} -eq 0 ]; then
            echo "No se encontraron Dockerfiles. Nada que construir."
            exit 0
          fi

          for df in "${DOCKERFILES[@]}"; do
            context_dir="$(dirname "$df")"

            if [ "$context_dir" = "." ]; then
              service="root"
            else
              # nombre de servicio estable a partir de la ruta
              service="$(echo "$context_dir" | tr '/_' '--')"
            fi

            image="${ROOT_IMAGE}-${service}"

            echo "----------------------------------------"
            echo "Servicio: ${service}"
            echo "Dockerfile: ${df}"
            echo "Contexto: ${context_dir}"
            echo "Destino: ${image}:latest y ${image}:${SHORT_SHA}"
            echo "----------------------------------------"

            # Build amd64 (por defecto en runner ubuntu-latest)
            docker build -f "${df}" -t "${image}:latest" -t "${image}:${SHORT_SHA}" "${context_dir}"

            # Push
            docker push "${image}:latest"
            docker push "${image}:${SHORT_SHA}"
          done

      - name: Summary
        if: always()
        run: |
          echo "Imágenes publicadas bajo: ${REPO_ROOT_IMAGE}-<servicio>:<tag>"
          echo "Usa :latest para despliegues flotantes o el tag de commit para fijar versión."
