name: CI/CD Pipeline — Test, Build, Push & Deploy

on:
  push:
    branches: [ "main", "dev", "test" ]
  pull_request:
    branches: [ "main", "dev", "test" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Backend Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir \
            -r api/auth/requirements.txt \
            -r api/occupancy/requirements.txt \
            -r api/video/requirements.txt \
            pytest httpx

      - name: Run unit tests
        run: |
          # Every file left under tests/ is now a real, isolated unit test:
          # they import each service's app directly (via TestClient) and
          # mock Redis/use a temp sqlite DB, so they need no live stack.
          # httpx is only needed for FastAPI's TestClient in tests, not for
          # running the services, so it's not in any service's requirements.txt.
          pytest tests/ -v

  lint:
    name: Lint & Security Scan (ruff + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install --no-cache-dir ruff pip-audit

      - name: Ruff check (lint)
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: pip-audit (dependency vulnerabilities)
        run: |
          set -euo pipefail
          for req in \
            api/auth/requirements.txt \
            api/occupancy/requirements.txt \
            api/video/requirements.txt \
            vision/processing/requirements.txt \
            vision/video_stream/requirements.txt; do
            echo "----------------------------------------"
            echo "Auditando ${req}"
            echo "----------------------------------------"
            pip-audit -r "${req}"
          done

  build-and-push:
    name: Build & Push Docker Images to GHCR
    needs: [test, lint]
    # Only main produces the images that actually get deployed — dev/test
    # pushes still run the test job above, but don't publish to GHCR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure image name
        run: |
          # GHCR exige el owner en minusculas; github.repository_owner
          # conserva las mayusculas del usuario/org de GitHub (seminarioA).
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "REPO_ROOT_IMAGE=ghcr.io/${OWNER_LOWER}/findparking" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all Dockerfiles (amd64)
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          ROOT_IMAGE="${REPO_ROOT_IMAGE}"

          echo "Usando imagen raíz: ${ROOT_IMAGE}"
          echo "SHA corto: ${SHORT_SHA}"

          # Nombres de imagen que infra/docker-compose.yml ya espera pullear
          # (no cambiar sin actualizar el compose a la vez).
          declare -A SERVICE_IMAGE_MAP=(
            ["api/auth/Dockerfile"]="services-auth-service"
            ["api/occupancy/Dockerfile"]="services-occupancy-service"
            ["api/video/Dockerfile"]="services-video-service"
            ["ui/frontend/Dockerfile"]="services-frontend-service"
            ["vision/processing/Dockerfile"]="services-processing-service"
            ["vision/video_stream/Dockerfile"]="services-video-stream-service"
          )

          # Encuentra todos los Dockerfiles versionados
          mapfile -t DOCKERFILES < <(git ls-files | grep -E '^(.*/)?Dockerfile$' || true)

          if [ ${#DOCKERFILES[@]} -eq 0 ]; then
            echo "No se encontraron Dockerfiles. Nada que construir."
            exit 0
          fi

          for df in "${DOCKERFILES[@]}"; do
            context_dir="$(dirname "$df")"

            if [ -n "${SERVICE_IMAGE_MAP[$df]:-}" ]; then
              service="${SERVICE_IMAGE_MAP[$df]}"
            elif [ "$context_dir" = "." ]; then
              service="root"
              echo "AVISO: ${df} no esta en SERVICE_IMAGE_MAP, usando nombre generico '${service}'."
            else
              # nombre de servicio generico a partir de la ruta (fallback para
              # Dockerfiles nuevos que aun no se agregaron a SERVICE_IMAGE_MAP)
              service="$(echo "$context_dir" | tr '/_' '--')"
              echo "AVISO: ${df} no esta en SERVICE_IMAGE_MAP, usando nombre generico '${service}'. Agregalo al mapa si docker-compose.yml debe pullearlo."
            fi

            image="${ROOT_IMAGE}-${service}"

            echo "----------------------------------------"
            echo "Servicio: ${service}"
            echo "Dockerfile: ${df}"
            echo "Contexto: ${context_dir}"
            echo "Destino: ${image}:latest y ${image}:${SHORT_SHA}"
            echo "----------------------------------------"

            # Build amd64 (por defecto en runner ubuntu-latest)
            docker build -f "${df}" -t "${image}:latest" -t "${image}:${SHORT_SHA}" "${context_dir}"

            # Push
            docker push "${image}:latest"
            docker push "${image}:${SHORT_SHA}"
          done

      - name: Summary
        if: always()
        run: |
          echo "Imágenes publicadas bajo: ${REPO_ROOT_IMAGE}-<servicio>:<tag>"
          echo "Usa :latest para despliegues flotantes o el tag de commit para fijar versión."

  deploy:
    name: Deploy to Production via SSH
    needs: build-and-push
    # Disabled by default: set the repo variable DEPLOY_ENABLED=true (Settings
    # > Secrets and variables > Actions > Variables) once DEPLOY_HOST,
    # DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_PATH secrets are configured.
    # Until then this job is skipped, not failed.
    # Nota: las imagenes en GHCR se marcan publicas tras el primer push, para
    # que este `docker compose pull` remoto funcione sin login adicional.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # environment: crea un Deployment real de GitHub por cada corrida, que es
    # lo que alimenta las metricas de Deployment Frequency / Lead Time for
    # Changes en el panel de Jira. El nombre "production" es el que las
    # integraciones DORA reconocen como tier de produccion.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export IMAGE_TAG="$(echo ${{ github.sha }} | cut -c1-7)"
            docker compose -f infra/docker-compose.yml pull
            docker compose -f infra/docker-compose.yml up -d
            docker image prune -f
