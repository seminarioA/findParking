services:
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  auth_service:
    image: aleseminario/findparking-auth_service:latest
    environment:
      - DATABASE_URL=postgresql+asyncpg://auth_user:auth_password@postgres:5432/auth_db
      - SECRET_KEY=super-secret-key
    env_file:
      - ./services/auth_service/.env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    expose:
      - "8000"

  processing_service:
    image: aleseminario/findparking-processing_service:latest
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped

  video_service:
    image: aleseminario/findparking-video_service:latest
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./services/video_service/.env
    depends_on:
      - redis
      - auth_service
    restart: unless-stopped
    expose:
      - "8004"

  occupancy_service:
    image: aleseminario/findparking-occupancy_service:latest
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./services/occupancy_service/.env
    depends_on:
      - redis
      - auth_service
    restart: unless-stopped
    expose:
      - "8000"

  video_stream_service:
    image: aleseminario/findparking-video_stream_service:latest
    environment:
      - VIDEO_PATHS={"entrada1":"resources/parking1.mp4"}
    volumes:
      - ./resources:/app/resources
    depends_on:
      - video_service
      - occupancy_service
      - auth_service
    restart: unless-stopped
    expose:
      - "8010"

  frontend_service:
    image: aleseminario/aleseminario/findparking-frontend_service:latest
    restart: unless-stopped
    expose:
      - "80"

  api_gateway:
    image: nginx:latest
    volumes:
      - ./services/api_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/frontend_service/dist:/var/www/html:ro
    ports:
      - "80:80"
    depends_on:
      frontend_service:
        condition: service_started
      auth_service:
        condition: service_started
      occupancy_service:
        condition: service_started
      video_service:
        condition: service_started
      video_stream_service:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: