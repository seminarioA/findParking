services:
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_user} -d ${POSTGRES_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    image: ghcr.io/seminarioa/findparking-services-auth-service:${IMAGE_TAG:-latest}
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-auth_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-auth_db}
    env_file:
      - ../api/auth/.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/docs', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  processing_service:
    image: ghcr.io/seminarioa/findparking-services-processing-service:${IMAGE_TAG:-latest}
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  video_service:
    image: ghcr.io/seminarioa/findparking-services-video-service:${IMAGE_TAG:-latest}
    environment:
      - REDIS_HOST=redis
    env_file:
      - ../api/video/.env
    depends_on:
      redis:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8004/docs', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  occupancy_service:
    image: ghcr.io/seminarioa/findparking-services-occupancy-service:${IMAGE_TAG:-latest}
    environment:
      - REDIS_HOST=redis
    env_file:
      - ../api/occupancy/.env
    depends_on:
      redis:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/docs', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  video_stream_service:
    image: ghcr.io/seminarioa/findparking-services-video-stream-service:${IMAGE_TAG:-latest}
    environment:
      - VIDEO_PATHS={"entrada1":"resources/parking1.mp4"}
    volumes:
      - ../core/resources:/app/resources
    depends_on:
      video_service:
        condition: service_healthy
      occupancy_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8010/docs', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend_service:
    image: ghcr.io/seminarioa/findparking-services-frontend-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    # Healthcheck already defined in the image's Dockerfile (wget against /).

  api_gateway:
    image: nginx:latest
    volumes:
      - ./api_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_static:/var/cache/nginx:rw
    ports:
      - "80:80"
    depends_on:
      frontend_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy
      occupancy_service:
        condition: service_healthy
      video_service:
        condition: service_healthy
      video_stream_service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  frontend_static:
