services:
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  auth_service:
    image: aleseminario/findparking-services-auth-service:${IMAGE_TAG:-latest}
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-auth_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-auth_db}
    env_file:
      - ../api/auth/.env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    expose:
      - "8000"

  processing_service:
    image: aleseminario/findparking-services-processing-service:${IMAGE_TAG:-latest}
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped

  video_service:
    image: aleseminario/findparking-services-video-service:${IMAGE_TAG:-latest}
    environment:
      - REDIS_HOST=redis
    env_file:
      - ../api/video/.env
    depends_on:
      - redis
      - auth_service
    restart: unless-stopped
    expose:
      - "8004"

  occupancy_service:
    image: aleseminario/findparking-services-occupancy-service:${IMAGE_TAG:-latest}
    environment:
      - REDIS_HOST=redis
    env_file:
      - ../api/occupancy/.env
    depends_on:
      - redis
      - auth_service
    restart: unless-stopped
    expose:
      - "8000"

  video_stream_service:
    image: aleseminario/findparking-services-video-stream-service:${IMAGE_TAG:-latest}
    environment:
      - VIDEO_PATHS={"entrada1":"resources/parking1.mp4"}
    volumes:
      - ../core/resources:/app/resources
    depends_on:
      - video_service
      - occupancy_service
      - auth_service
    restart: unless-stopped
    expose:
      - "8010"

  frontend_service:
    image: aleseminario/findparking-services-frontend-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"

  api_gateway:
    image: nginx:latest
    volumes:
      - ./api_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_static:/var/cache/nginx:rw
    ports:
      - "80:80"
    depends_on:
      frontend_service:
        condition: service_started
      auth_service:
        condition: service_started
      occupancy_service:
        condition: service_started
      video_service:
        condition: service_started
      video_stream_service:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  frontend_static:
