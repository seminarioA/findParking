services:
  # ----------------------------------------------------------------------
  # FRONTEND LOCAL (Reemplaza la imagen del registry con build local)
  # ----------------------------------------------------------------------
frontend_service:
  build:
    context: ../ui/frontend
    dockerfile: Dockerfile
  volumes:
    - ../ui/frontend:/app         # Para hot reload si aplica
    expose:
      - "80"
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # API Gateway también sirve archivos estáticos del frontend
  # Así que montamos la carpeta build local (si tu frontend genera /dist o /build)
  # ----------------------------------------------------------------------
api_gateway:
  volumes:
    - ./api_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    - ../ui/frontend/dist:/var/cache/nginx:rw
